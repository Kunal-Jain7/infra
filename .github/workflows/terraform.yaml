name: Terraform Infrastructure

# PR to main        → plan only
# Push/merge to main → plan (auto) → approval gate → apply
# Manual dispatch    → plan, apply, or destroy dev environment

on:
    push:
      branches:
        - main
      paths:
        - 'envs/dev/**'
        - 'modules/**'
    pull_request:
      branches:
        - main
      paths:
        - 'envs/dev/**'
        - 'modules/**'
    workflow_dispatch:
      inputs:
        action:
          description: 'Terraform action to perform'
          required: true
          default: 'plan'
          type: choice
          options: [plan, apply, destroy]
        confirm_destroy:
          description: 'Confirm destroy action (type "yes" to confirm)'
          required: false
          default: ''
permissions:
  contents: read

env:
  TF_VERSION: '1.15.8'
  AWS_REGION: 'us-east-1'

# Prevent parallel runs on the same branch — avoids state conflicts
concurrency:
  group: 'terraform-${{ github.ref }}'
  cancel-in-progress: false      # wait, don't cancel — safer for Terraform

jobs:
  # ── Plan ──────────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION}}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform format check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false
      
      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.DEV_JWT_SECRET }}" \
            -var="github_org=${{ vars.GH_ORG }}" \
            -out=tfplan
            -no-color
        continue-on-error: true

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
    
      - name: Release state Lock on Failure
        if: failure() || cancelled()
        run: |
          aws s3 rm s3://${{ vars.TF_STATE_BUCKET }}/envs/dev/terraform.tfstate.tflock || true
          
      - name: Upload Plan Artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: tfplan
          path: envs/dev/tfplan
          retention-days: 5
        
# ── Apply ─────────────────────────────────────────────────────────────────


